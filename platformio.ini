; Velocímetro GPS - Cardputer-Adv + Cap LoRa-1262
[platformio]
; caminho curto: evita o limite de 260 caracteres do Windows
core_dir = C:/pio

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Cardputer
    mikalhart/TinyGPSPlus
